[project]
name = "agent-framework-realtime-prototype"
description = "PROTOTYPE, never merged: the accelerator's voice loop on the extended ADR 0035 realtime API (adamdougal/agent-framework#10)."
authors = [{ name = "Microsoft", email = "af-support@microsoft.com"}]
requires-python = ">=3.11"
version = "0.0.0"
dependencies = [
    "agent-framework-core",
    "agent-framework-openai",
    "agent-framework-foundry",
    "agent-framework-orchestrations",
    "openai[realtime]>=2.25.0,<4",
    "azure-ai-voicelive[aiohttp]>=1.3.1,<2",
    "azure-ai-projects>=2.7,<2.8",
    "azure-identity",
    "fastapi",
    "uvicorn[standard]",
    "mcp",
    "opentelemetry-sdk",
    "pyyaml",
    "tenacity",
    "azure-core-tracing-opentelemetry",
]

[tool.uv.sources]
agent-framework-core = { workspace = true }
agent-framework-openai = { workspace = true }
agent-framework-foundry = { workspace = true }
agent-framework-orchestrations = { workspace = true }

[build-system]
requires = ["flit-core>=3.11,<5.0"]
build-backend = "flit_core.buildapi"
